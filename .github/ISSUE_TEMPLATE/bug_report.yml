name: Bug report
description: Something renders wrong, throws, or does not match the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal template JSON is worth more than
        a paragraph of description — it is what turns into a test.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest template + bindings JSON that shows the problem, or a
        link to a fork of one of the examples. A playground link works too.
      render: json
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      options:
        - In the editor (Designer UI)
        - In generatePdf (backend or worker)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: json-pdf-designer version
      placeholder: "3.3.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node / React / browser
      placeholder: "Node 20.11, React 19, Chrome 131"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Full stack trace if there is one.
      render: shell
